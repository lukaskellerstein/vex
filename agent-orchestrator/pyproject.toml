[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Vex AgentManager — orchestrates AI coding agents for visual web editing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "nats-py>=2.9.0",
    "pydantic>=2.10.0",
    "claude-agent-sdk>=0.1.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# No [tool.ruff] here on purpose. Ruff resolves config per file by walking up,
# so a table here would shadow the repo-root ruff.toml for this whole leaf — and
# a [tool.ruff] with no lint.select does not mean "defaults", it means ruff's
# full rule set (measured on 0.16.0: S110 and BLE001 fire). target-version is
# inferred from requires-python above.

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]
