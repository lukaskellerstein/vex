<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <style>
    .arm-left { animation: type-left 0.6s ease-in-out infinite; transform-origin: 28px 82px; }
    .arm-right { animation: type-right 0.6s ease-in-out infinite 0.3s; transform-origin: 92px 82px; }
    .head { animation: head-bob 1.2s ease-in-out infinite; }
    .antenna-light { animation: blink 0.8s ease-in-out infinite; }
    .eye-left, .eye-right { animation: eye-flicker 2s step-end infinite; }

    @keyframes type-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-12deg); }
    }
    @keyframes type-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes head-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.4; fill: #a78bfa; }
      50% { opacity: 1; fill: #c4b5fd; }
    }
    @keyframes eye-flicker {
      0%, 90% { opacity: 1; }
      95% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Antenna -->
  <line x1="60" y1="18" x2="60" y2="30" stroke="#6d6d8a" stroke-width="2" stroke-linecap="round"/>
  <circle class="antenna-light" cx="60" cy="14" r="4" fill="#a78bfa"/>

  <!-- Head -->
  <g class="head">
    <rect x="35" y="30" width="50" height="36" rx="6" fill="#2a2a3d" stroke="#4a4a6a" stroke-width="1.5"/>
    <!-- Eyes -->
    <rect class="eye-left" x="44" y="42" width="10" height="6" rx="1" fill="#7dd3fc"/>
    <rect class="eye-right" x="66" y="42" width="10" height="6" rx="1" fill="#7dd3fc"/>
    <!-- Mouth -->
    <rect x="50" y="56" width="20" height="2" rx="1" fill="#4a4a6a"/>
  </g>

  <!-- Neck -->
  <rect x="55" y="66" width="10" height="6" rx="2" fill="#3a3a52"/>

  <!-- Body -->
  <rect x="30" y="72" width="60" height="40" rx="8" fill="#2a2a3d" stroke="#4a4a6a" stroke-width="1.5"/>
  <!-- Chest indicator -->
  <circle cx="60" cy="88" r="5" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
  <circle cx="60" cy="88" r="2" fill="#a78bfa" opacity="0.8"/>

  <!-- Left Arm -->
  <g class="arm-left">
    <rect x="16" y="76" width="14" height="28" rx="5" fill="#2a2a3d" stroke="#4a4a6a" stroke-width="1.5"/>
    <!-- Hand -->
    <rect x="19" y="100" width="8" height="6" rx="3" fill="#3a3a52"/>
  </g>

  <!-- Right Arm -->
  <g class="arm-right">
    <rect x="90" y="76" width="14" height="28" rx="5" fill="#2a2a3d" stroke="#4a4a6a" stroke-width="1.5"/>
    <!-- Hand -->
    <rect x="93" y="100" width="8" height="6" rx="3" fill="#3a3a52"/>
  </g>

  <!-- Legs -->
  <rect x="40" y="112" width="12" height="18" rx="4" fill="#2a2a3d" stroke="#4a4a6a" stroke-width="1.5"/>
  <rect x="68" y="112" width="12" height="18" rx="4" fill="#2a2a3d" stroke="#4a4a6a" stroke-width="1.5"/>
  <!-- Feet -->
  <rect x="36" y="128" width="18" height="6" rx="3" fill="#3a3a52"/>
  <rect x="66" y="128" width="18" height="6" rx="3" fill="#3a3a52"/>
</svg>
